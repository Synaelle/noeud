name: image

# The server image on ghcr.io, for x86 machines and ARM ones like the
# Raspberry Pi (64-bit, and 32-bit from the Pi 2). Every platform is built
# and started first, ARM ones under emulation, so a broken image is never
# published. A tag vX.Y.Z then publishes X.Y.Z, X.Y, X and latest, once the
# tag matches the version in Cargo.toml; run by hand, it only tries. The
# image carries its SBOM and build provenance and is signed with cosign by
# this workflow's own GitHub identity, so there is no key to keep.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  try:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: cache name
        id: scope
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "scope=$(echo "$PLATFORM" | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: noeud-check
          cache-from: type=gha,scope=${{ steps.scope.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.scope.outputs.scope }}
      - name: the image starts and answers
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          docker run -d --name check --platform "$PLATFORM" -p 127.0.0.1:8470:8470 noeud-check
          docker image inspect noeud-check --format 'built for {{.Os}}/{{.Architecture}}{{if .Variant}}/{{.Variant}}{{end}}'
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8470/v1/health; then
              docker rm -f check
              exit 0
            fi
            sleep 2
          done
          docker logs check
          exit 1

  publish:
    needs: try
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # the signature's identity: this workflow, from GitHub's OIDC
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: what to publish
        id: plan
        run: |
          set -eu
          # ghcr wants the name lowercase
          image=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version=${GITHUB_REF_NAME#v}
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$workspace" ]; then
            echo "the tag says $version, Cargo.toml says $workspace" >&2
            exit 1
          fi
          major=${version%%.*}
          minor=${version#*.}
          minor=${minor%%.*}
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:$major.$minor"
            echo "$image:$major"
            echo "$image:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # the same layers as the tried images, from their caches
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.plan.outputs.commit }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          cache-from: |
            type=gha,scope=linux-amd64
            type=gha,scope=linux-arm64
            type=gha,scope=linux-arm-v7
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.plan.outputs.image }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-identity-regexp "^$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/image.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" > /dev/null
          echo "signed and checked: $IMAGE@$DIGEST"
