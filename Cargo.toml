[workspace]
resolver = "3"
members = ["server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic noise that does not improve readability here
module_name_repetitions = "allow"
must_use_candidate = "allow"
# `assert!(x.is_empty())` reads better than comparing to a typed empty array
assert_is_empty = "allow"

[profile.release]
# size and memory matter more than peak speed for a small always-on server
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
