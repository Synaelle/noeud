# Noeud under /noeud/ of a site Caddy already serves, so no new name or certificate is
# needed: put the handle_path block inside that site's block. Caddy drops /noeud before
# passing the request on, so the server knows nothing of the path.
handle_path /noeud/* {
    reverse_proxy 127.0.0.1:8470 {
        # GET /v1/events stays open: pass each event on at once
        flush_interval -1
    }
}
