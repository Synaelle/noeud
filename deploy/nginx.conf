# Noeud under /noeud/ of a site nginx already serves, so no new name or certificate is
# needed. It goes inside that site's server { ... } block listening on 443. nginx drops
# /noeud before passing the request on, so the server knows nothing of the path.
location /noeud/ {
    proxy_pass http://127.0.0.1:8470/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    # GET /v1/events stays open: no buffering, and the server writes at least every 30 s
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 64k;
}
