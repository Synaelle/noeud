# Noeud under /noeud/ of a site Apache already serves, so no new name or certificate is
# needed: put the Location block inside that site's <VirtualHost *:443>, with mod_proxy
# and mod_proxy_http on (a2enmod proxy proxy_http). Apache drops /noeud before passing
# the request on, so the server knows nothing of the path.
<Location /noeud/>
    # GET /v1/events stays open: pass each event on at once, for up to an hour, and
    # never compress it, which would hold events back
    ProxyPass http://127.0.0.1:8470/ flushpackets=on timeout=3600
    ProxyPassReverse http://127.0.0.1:8470/
    SetEnv no-gzip 1
    LimitRequestBody 65536
</Location>
